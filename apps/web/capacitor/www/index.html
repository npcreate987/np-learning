<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>NP Learning</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #4f46e5;
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.15);
        font-size: 36px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        opacity: 0.85;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🎓</div>
      <h1>NP Learning</h1>
      <p>
        ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ในขณะนี้<br />
        กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่อีกครั้ง
      </p>
    </div>
  </body>
</html>
