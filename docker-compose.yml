services:
  postgres:
    image: postgres:16-alpine
    container_name: learn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn
    ports:
      - "5433:5432"
    volumes:
      - learn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  learn-pgdata:
